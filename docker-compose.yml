services:
  markdown-render:
    build: .
    container_name: markdown-share-tool
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      INTERNAL_BASE_URL: http://127.0.0.1:5173
      # Optional: set these when the server needs a proxy to fetch ChatGPT/Gemini share pages.
      # HTTP_PROXY: http://host.docker.internal:7890
      # HTTPS_PROXY: http://host.docker.internal:7890
      # ALL_PROXY: socks5://host.docker.internal:7890
    ports:
      - "5173:5173"
    shm_size: "1gb"
