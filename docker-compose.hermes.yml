services:
  markdown-render:
    build: .
    container_name: hermes-markdown-render
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      INTERNAL_BASE_URL: http://127.0.0.1:5173
      HTTP_PROXY: http://192.168.31.200:7890
      HTTPS_PROXY: http://192.168.31.200:7890
      ALL_PROXY: socks5://192.168.31.200:7890
    ports:
      - "5173:5173"
    shm_size: "1gb"
    networks:
      bypass_net:
        ipv4_address: 192.168.31.203
networks:
  bypass_net:
    external: true
    name: bypass_net
